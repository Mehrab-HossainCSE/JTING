@if (!canView()) {
  <div class="no-permission-card">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body">
        <h3>Access Denied</h3>
        <p>You do not have permission to view Picking.</p>
      </div>
    </div>
  </div>
}

@if (canView()) {
  <div class="picking-layout-wrapper">

    <!-- Sub Navigation Tabs -->
    <div class="card sub-tabs-card shadow-sm border-0 rounded-3">
      <div class="sub-tabs-bar">
        @for (tab of subTabs; track tab.path) {
          <a class="sub-tab-btn"
             [routerLink]="tab.path"
             routerLinkActive="active">
            {{ tab.name }}
          </a>
        }
      </div>
    </div>

    <!-- Routed Page Components -->
    <div class="routed-content-area">
      <router-outlet></router-outlet>
    </div>

  </div>
}
