<aside class="sidebar" [class.collapsed]="isCollapsed()">
  
  <!-- Toggle Button -->
  <button class="toggle-btn" (click)="toggleSidebar()">
    <i class="bi" [class.bi-chevron-left]="!isCollapsed()" [class.bi-chevron-right]="isCollapsed()"></i>
  </button>

  <div class="sidebar-brand">
    <img src="/images/logo/jti-logo.png" alt="JTI Logo" class="brand-logo">
    <div class="sub-brand" *ngIf="!isCollapsed()">WAREHOUSE MANAGEMENT</div>
  </div>

  <nav class="sidebar-nav">
    @for (menu of menus(); track menu.id!) {
      <div class="nav-item-wrapper">
        <a
          class="nav-item"
          [routerLink]="menu.url"
          routerLinkActive="active"
          [title]="isCollapsed() ? menu.displayName : ''"
          [routerLinkActiveOptions]="{
            exact: menu.url == '/dashboard'
          }"
        >
          <span class="nav-icon" [innerHTML]="getIcon(menu.displayName)"></span>
          <span class="nav-label" *ngIf="!isCollapsed()">{{ menu.displayName }}</span>
        </a>
      </div>
    }
  </nav>

  <div class="sidebar-footer">
    <div class="profile-card">
      <div class="avatar">JA</div>
      <div class="info" *ngIf="!isCollapsed()">
        <span class="name">James Admin</span>
        <span class="email">admin@jti.com</span>
      </div>
    </div>
  </div>

</aside>
