<div class="user-tab-page">
  <div *ngIf="!canView()" class="no-permission-card">
    <div class="card">
      <div class="card-body">
        <h3>Access Denied</h3>
        <p>You do not have permission to view Assign Module With Role.</p>
      </div>
    </div>
  </div>

  <ng-container *ngIf="canView()">
    <div class="header-section">
      <h1 class="page-title">User Menu Distribution</h1>
      
      <div class="user-selector-wrapper">
        <select id="roleSelect" [ngModel]="selectedRole()" (ngModelChange)="onRoleChange($event)" class="form-control premium-select">
          <option value="" disabled> Select a Role </option>
          <option *ngFor="let role of roles()" [value]="role.id">{{ role.name }}</option>
        </select>
        
        <button *ngIf="canUpdate()" class="btn-save" (click)="savePermissions()" [disabled]="!selectedRole()">
          Save
        </button>
      </div>
    </div>

    <div class="menu-distribution-flex">

      <div class="menu-card" *ngFor="let section of menuSections()">
        <div class="card-header">
          <div class="header-left">
            <label class="checkbox-container main-header">
              <input type="checkbox" [(ngModel)]="section.isSelected" (change)="onSectionToggle(section)" [disabled]="!canUpdate()">
              <span class="checkmark"></span>
              <span class="label-text">{{ section.title }}</span>
            </label>
          </div>

          <div class="header-right">
            <label class="checkbox-container action-checkbox header-action" title="Toggle All View">
              <input type="checkbox" [(ngModel)]="section.allView" (change)="onPermissionToggle(section, 'view')" [disabled]="!canUpdate()">
              <span class="checkmark small"></span>
              <span class="action-label">View</span>
            </label>

            <label class="checkbox-container action-checkbox header-action" title="Toggle All Add">
              <input type="checkbox" [(ngModel)]="section.allAdd" (change)="onPermissionToggle(section, 'add')" [disabled]="!canUpdate()">
              <span class="checkmark small"></span>
              <span class="action-label">Add</span>
            </label>

            <label class="checkbox-container action-checkbox header-action" title="Toggle All Edit">
              <input type="checkbox" [(ngModel)]="section.allEdit" (change)="onPermissionToggle(section, 'edit')" [disabled]="!canUpdate()">
              <span class="checkmark small"></span>
              <span class="action-label">Edit</span>
            </label>

          </div>
        </div>
        
        <div class="card-body" *ngIf="section.items.length > 0">
          <div class="menu-item" *ngFor="let item of section.items">
            <div class="item-main">
              <label class="checkbox-container">
                <input type="checkbox" [(ngModel)]="item.isSelected" (change)="onItemToggle(section, item)" [disabled]="!canUpdate()">
                <span class="checkmark"></span>
                <span class="item-name">{{ item.name }}</span>
              </label>
            </div>
            
            <div class="item-actions">
              <label class="checkbox-container action-checkbox">
                <input type="checkbox" [(ngModel)]="item.view" [disabled]="!canUpdate()">
                <span class="checkmark small"></span>
                <span class="action-label">View</span>
              </label>

              <label class="checkbox-container action-checkbox">
                <input type="checkbox" [(ngModel)]="item.add" [disabled]="!canUpdate()">
                <span class="checkmark small"></span>
                <span class="action-label">Add</span>
              </label>

              <label class="checkbox-container action-checkbox">
                <input type="checkbox" [(ngModel)]="item.edit" [disabled]="!canUpdate()">
                <span class="checkmark small"></span>
                <span class="action-label">Edit</span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>
