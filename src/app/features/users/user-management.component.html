<div class="user-management-page" [class.full-scroll-layout]="activeChildPath() === 'assign-role'">
  <div class="card tabs-card" *ngIf="tabs().length">
    <div class="tabs-grid">
      @for (tab of tabs(); track tab.id) {
        <button
          class="tab-btn"
          [class.active]="activeTabId() === tab.id"
          (click)="navigateToTab(tab)"
        >
          <span class="tab-icon">{{ tab.icon }}</span>
          <span class="tab-label">{{ tab.label }}</span>
        </button>
      }
    </div>
  </div>

  <div class="content-body" *ngIf="hasActiveChild()">
    <router-outlet></router-outlet>
  </div>
</div>
