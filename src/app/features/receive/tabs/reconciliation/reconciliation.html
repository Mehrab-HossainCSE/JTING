<div *ngIf="!canView()" class="no-permission-card">
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body">
      <h3>Access Denied</h3>
      <p>You do not have permission to view Reconciliation.</p>
    </div>
  </div>
</div>

<div *ngIf="canView()" class="reconciliation-layout-wrapper">
  
  <!-- CARD 1: Sub Navigation Tabs -->
  <div class="card sub-tabs-card shadow-sm border-0 rounded-3">
    <div class="card-body py-2 px-3">
      <div class="sub-tabs-bar">
        <a *ngFor="let tab of subTabs"
           class="sub-tab-btn"
           [routerLink]="tab.path"
           routerLinkActive="active">
          {{ tab.name }}
        </a>
      </div>
    </div>
  </div>

  <!-- Routed Components (Contains Card 2 & Card 3) -->
  <div class="routed-content-area">
    <router-outlet></router-outlet>
  </div>

</div>
