<div class="history-container">
  
  <div class="card table-card">
    <!-- Card Header -->
    <div class="card-header-custom">
      <span class="card-title">Data List</span>
      
      <!-- Filters Row integrated in the header block as in screenshot -->
      <div class="header-filters-row">
        <!-- From Date -->
        <div class="form-group-custom">
          <label for="fromDateInput">From Date</label>
          <input id="fromDateInput" type="date" class="form-input-custom" [ngModel]="fromDate()" (ngModelChange)="fromDate.set($event)" />
        </div>

        <!-- To Date -->
        <div class="form-group-custom">
          <label for="toDateInput">To Date :</label>
          <input id="toDateInput" type="date" class="form-input-custom" [ngModel]="toDate()" (ngModelChange)="toDate.set($event)" />
        </div>

        <!-- Type Select -->
        <div class="form-group-custom">
          <label for="typeSelect">Type</label>
          <select id="typeSelect" class="form-select-custom" [ngModel]="selectedType()" (ngModelChange)="selectedType.set($event)">
            @for (t of types(); track t) {
              <option [value]="t">{{ t }}</option>
            }
          </select>
        </div>

        <!-- Search Button -->
        <button type="button" class="btn-green btn-search" (click)="onSearch()">
          Search
        </button>
      </div>
    </div>

    <!-- Table Body -->
    <div class="table-scroll-container">
      <table class="history-table">
        <thead>
          <tr>
            <th>Cancel No</th>
            <th>Date</th>
            <th>Remarks</th>
            <th>Cancel By</th>
            <th class="text-center" style="width: 100px;">Action</th>
          </tr>
        </thead>
        <tbody>
          @for (item of storyList(); track item.cancelId) {
            <tr class="table-row">
              <td><span class="cancel-no-badge">{{ item.cancelId }}</span></td>
              <td>{{ item.cancelDate }}</td>
              <td>
                <div class="text-truncate remarks-cell" [title]="item.reason">
                  {{ item.reason }}
                </div>
              </td>
              <td><span class="user-pill">{{ item.cancelledBy }}</span></td>
              <td class="text-center">
                <button type="button" class="btn-details-view" aria-label="View cancellation details" (click)="onViewDetails(item)">
                  <i class="bi bi-eye"></i> Details
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="empty-state">
                No cancellation history found. Adjust dates or type filters.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

  </div>

</div>
