@if (loaderService.isLoading()) {
  <div class="loader-overlay">
    <div class="loader-card">
      <div class="loader-spinner-container">
        <div class="loader-spinner"></div>
        <div class="loader-icon-inner">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="loader-svg-icon">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <rect x="9" y="12" width="6" height="6" rx="1"></rect>
            <path d="M12 12v6"></path>
            <path d="M9 15h6"></path>
          </svg>
        </div>
      </div>
      <h3 class="loader-message">{{ loaderService.message() }}</h3>
      <span class="loader-subtext">Ready</span>
    </div>
  </div>
}
