<aside class="sidebar" [class.collapsed]="isCollapsed()">
  
  <!-- Toggle Button -->
  <button class="toggle-btn" (click)="toggleSidebar()">
    <svg *ngIf="!isCollapsed()" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    <svg *ngIf="isCollapsed()" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </button>

  <div class="sidebar-brand">
    <a routerLink="/dashboard" class="logo-link d-block">
      <img src="/images/logo/jti-logo.png" alt="JTI Logo" class="brand-logo">
    </a>
    <div class="sub-brand" *ngIf="!isCollapsed()">WAREHOUSE MANAGEMENT</div>
  </div>

  <nav class="sidebar-nav">
    @for (menu of menuService.menus(); track menu.id) {
      <div class="nav-item-wrapper">
        <a
          class="nav-item"
          [routerLink]="getParentRoute(menu)"
          routerLinkActive="active"
          [title]="isCollapsed() ? menu.displayName : ''"
          [routerLinkActiveOptions]="{
            exact: getParentRoute(menu) === '/dashboard' || getParentRoute(menu) === '/dashboard/main'
          }"
        >
          <span class="nav-icon" [innerHTML]="getIcon(menu.navIcon || menu.name)"></span>
          <span class="nav-label" *ngIf="!isCollapsed()">{{ menu.displayName }}</span>
        </a>
      </div>
    }
  </nav>

</aside>
