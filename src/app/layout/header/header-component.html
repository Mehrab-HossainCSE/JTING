<header class="header">
  <div class="header-left">
    <h2 class="page-title">{{ getPageTitle() }}</h2>
  </div>

  <div class="header-right">
    <!-- Search Bar -->
    <div class="search-wrapper">
      <i class="bi bi-search"></i>
      <input type="text" placeholder="Search inventory, orders..." class="search-input">
    </div>

    <!-- Actions -->
    <div class="header-actions">
      <button class="action-btn"><i class="bi bi-moon"></i></button>
      <button class="action-btn"><i class="bi bi-question-circle"></i></button>
      <button class="action-btn position-relative">
        <i class="bi bi-bell"></i>
        <span class="notification-badge">3</span>
      </button>
    </div>

    <!-- User Profile Dropdown -->
    <div class="user-profile-dropdown" [class.active]="isProfileDropdownOpen">
      <div class="user-profile" (click)="toggleProfileDropdown()">
        <div class="user-avatar">
          JA
        </div>
        <div class="user-info">
          <span class="name">James Admin</span>
          <span class="role">Administrator</span>
        </div>
        <i class="bi bi-chevron-down ms-2 toggle-icon"></i>
      </div>

      <!-- Dropdown Menu -->
      <div class="dropdown-menu-custom" *ngIf="isProfileDropdownOpen">
        <div class="dropdown-header">
          <div class="user-avatar large">JA</div>
          <div class="user-details">
            <span class="full-name">James Admin</span>
            <span class="email">james.admin@jti.com</span>
          </div>
        </div>
        
        <div class="dropdown-divider"></div>
        
        <a class="dropdown-item">
          <i class="bi bi-person"></i>
          <span>Profile Settings</span>
        </a>
        <a class="dropdown-item">
          <i class="bi bi-gear"></i>
          <span>Preferences</span>
        </a>
        
        <div class="dropdown-divider"></div>
        
        <a class="dropdown-item logout-item" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i>
          <span>Sign Out</span>
        </a>
      </div>
    </div>
  </div>
</header>
